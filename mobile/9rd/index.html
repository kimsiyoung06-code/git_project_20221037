<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f7f2">
  <title>구구단 연습장</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172a2a;
      --muted: #647574;
      --paper: #f6f7f2;
      --panel: #ffffff;
      --line: #dce4df;
      --teal: #137c72;
      --teal-dark: #0e625a;
      --coral: #f17b63;
      --sun: #f4c84f;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#d5dfd9 0.8px, transparent 0.8px);
      background-size: 19px 19px;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }

    button, input { font: inherit; }

    .page {
      width: min(1050px, calc(100% - 40px));
      margin: 0 auto;
      padding: 38px 0 52px;
      animation: arrive 420ms ease-out both;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 48px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); }
    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      color: var(--ink);
      background: var(--sun);
      font-size: 17px;
      font-weight: 900;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(270px, 0.82fr) minmax(380px, 1.18fr);
      gap: 28px;
      align-items: start;
    }

    .intro { padding: 18px 8px 0 0; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 800;
    }
    .eyebrow::before {
      width: 18px;
      height: 3px;
      background: var(--coral);
      content: "";
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 6vw, 68px);
      line-height: 1.12;
      letter-spacing: 0;
    }
    h1 span { color: var(--teal); }
    .description {
      max-width: 330px;
      margin: 20px 0 30px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .number-art {
      position: relative;
      display: grid;
      width: 178px;
      aspect-ratio: 1;
      margin: 34px 0 0 5px;
      place-items: center;
      border: 1px solid #d5e0d9;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.64);
    }
    .number-art::before, .number-art::after {
      position: absolute;
      content: "";
    }
    .number-art::before {
      inset: 14px;
      border: 1px dashed #b5c9bf;
      border-radius: 50%;
    }
    .number-art::after {
      top: 20px;
      right: 12px;
      width: 23px;
      height: 23px;
      border: 5px solid var(--coral);
      border-radius: 50%;
      background: var(--paper);
    }
    .number-art strong { z-index: 1; font-size: 45px; line-height: 1; }
    .number-art small {
      position: absolute;
      right: -54px;
      bottom: 17px;
      padding: 8px 11px;
      border-radius: 5px;
      color: var(--ink);
      background: var(--sun);
      font-size: 12px;
      font-weight: 800;
      transform: rotate(-5deg);
    }

    .workspace {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: 0 16px 48px rgba(32, 63, 54, 0.08);
    }
    .form-area { padding: 26px 28px 23px; }
    .section-label {
      display: block;
      margin-bottom: 13px;
      font-size: 14px;
      font-weight: 800;
    }
    .input-row { display: flex; gap: 9px; }
    .input-wrap { position: relative; flex: 1; }
    .input-wrap input {
      width: 100%;
      height: 50px;
      padding: 0 46px 0 15px;
      border: 1px solid #cbd8d1;
      border-radius: 6px;
      outline: none;
      color: var(--ink);
      background: #fcfdfb;
      font-size: 17px;
      font-weight: 700;
      transition: border-color 140ms, box-shadow 140ms;
    }
    .input-wrap input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(19, 124, 114, 0.13); }
    .input-wrap input[aria-invalid="true"] { border-color: #c94c3e; }
    .input-unit {
      position: absolute;
      top: 50%;
      right: 15px;
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
      transform: translateY(-50%);
    }
    .make-button {
      min-width: 100px;
      height: 50px;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: var(--teal);
      font-weight: 800;
      cursor: pointer;
      transition: background 140ms, transform 140ms;
    }
    .make-button:hover { background: var(--teal-dark); }
    .make-button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid rgba(241, 123, 99, 0.65); outline-offset: 3px; }
    .error { min-height: 19px; margin: 8px 0 0; color: #b43e32; font-size: 12px; }

    .quick-picks {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 15px;
    }
    .pick {
      display: grid;
      width: 37px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--muted);
      background: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: color 140ms, border-color 140ms, background 140ms;
    }
    .pick:hover { border-color: var(--teal); color: var(--teal-dark); }
    .pick[aria-pressed="true"] { border-color: var(--teal); color: #fff; background: var(--teal); }

    .results { border-top: 1px solid var(--line); }
    .results-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 70px;
      padding: 14px 28px;
      background: #f8faf7;
    }
    .results-heading h2 { margin: 0; font-size: 20px; }
    .results-heading p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .result-count {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 50%;
      color: var(--teal-dark);
      background: #e2f1e9;
      font-size: 13px;
      font-weight: 800;
    }
    .table-head, .equation {
      display: grid;
      grid-template-columns: 52px 1fr 1fr;
      align-items: center;
      padding: 0 28px;
    }
    .table-head {
      min-height: 35px;
      color: #71807a;
      background: #fff;
      font-size: 11px;
      font-weight: 800;
    }
    .equation {
      min-height: 45px;
      border-top: 1px solid #edf1ed;
      font-size: 15px;
      animation: row-in 250ms ease-out both;
    }
    .equation:nth-child(2n) { background: #fbfcfa; }
    .equation .step { color: #87948e; font-size: 12px; font-variant-numeric: tabular-nums; }
    .equation .math { font-variant-numeric: tabular-nums; }
    .equation .answer { color: var(--teal-dark); font-weight: 900; font-variant-numeric: tabular-nums; }
    .empty-state {
      display: grid;
      min-height: 258px;
      padding: 28px;
      place-content: center;
      text-align: center;
    }
    .empty-state strong { margin-bottom: 7px; font-size: 15px; }
    .empty-state span { color: var(--muted); font-size: 13px; }

    @keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes row-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 720px) {
      .page { width: min(540px, calc(100% - 32px)); padding-top: 23px; }
      .topline { margin-bottom: 28px; }
      .layout { grid-template-columns: 1fr; gap: 23px; }
      .intro { padding: 0; }
      .eyebrow { margin-bottom: 12px; }
      h1 { font-size: 48px; }
      .description { max-width: 420px; margin: 12px 0 0; font-size: 14px; }
      .number-art { display: none; }
      .form-area { padding: 22px 20px 18px; }
      .results-heading { padding-right: 20px; padding-left: 20px; }
      .table-head, .equation { grid-template-columns: 42px 1fr 1fr; padding-right: 20px; padding-left: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">×</span><span>오늘의 수학</span></div>
      <span>구구단 연습장</span>
    </header>

    <div class="layout">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">MULTIPLICATION TABLE</p>
        <h1 id="page-title">구구단을<br><span>만들어 봐요.</span></h1>
        <p class="description">궁금한 단을 입력하면 곱셈식을 한눈에 볼 수 있어요. 숫자를 눌러 빠르게 바꿔 보세요.</p>
        <div class="number-art" aria-hidden="true"><strong>×</strong><small>차근차근!</small></div>
      </section>

      <section class="workspace" aria-label="구구단 만들기">
        <form class="form-area" id="gugudan-form" novalidate>
          <label class="section-label" for="dan-input">몇 단을 만들까요?</label>
          <div class="input-row">
            <div class="input-wrap">
              <input id="dan-input" name="dan" type="number" min="2" max="9" step="1" inputmode="numeric" placeholder="예: 7" aria-describedby="input-error" required>
              <span class="input-unit" aria-hidden="true">단</span>
            </div>
            <button class="make-button" type="submit">만들기 <span aria-hidden="true">→</span></button>
          </div>
          <p class="error" id="input-error" role="alert" aria-live="polite"></p>
          <div class="quick-picks" aria-label="빠른 단 선택">
            <button class="pick" type="button" data-dan="2" aria-pressed="false">2</button>
            <button class="pick" type="button" data-dan="3" aria-pressed="false">3</button>
            <button class="pick" type="button" data-dan="4" aria-pressed="false">4</button>
            <button class="pick" type="button" data-dan="5" aria-pressed="false">5</button>
            <button class="pick" type="button" data-dan="6" aria-pressed="false">6</button>
            <button class="pick" type="button" data-dan="7" aria-pressed="false">7</button>
            <button class="pick" type="button" data-dan="8" aria-pressed="false">8</button>
            <button class="pick" type="button" data-dan="9" aria-pressed="false">9</button>
          </div>
        </form>

        <section class="results" aria-labelledby="result-title" aria-live="polite" aria-atomic="true">
          <div class="results-heading">
            <div><h2 id="result-title">구구단</h2><p id="result-caption">단을 선택하면 결과가 여기에 나와요.</p></div>
            <span class="result-count" id="result-count" aria-label="결과 개수">0</span>
          </div>
          <div id="result-list">
            <div class="empty-state"><strong>어떤 단이 궁금한가요?</strong><span>위에서 숫자를 선택하거나 직접 입력해 보세요.</span></div>
          </div>
        </section>
      </section>
    </div>
  </main>

  <script>
    const form = document.querySelector("#gugudan-form");
    const input = document.querySelector("#dan-input");
    const error = document.querySelector("#input-error");
    const resultTitle = document.querySelector("#result-title");
    const resultCaption = document.querySelector("#result-caption");
    const resultCount = document.querySelector("#result-count");
    const resultList = document.querySelector("#result-list");
    const quickPicks = document.querySelectorAll(".pick");

    function makeTable(value) {
      const dan = Number(value);
      if (!Number.isInteger(dan) || dan < 2 || dan > 9) {
        error.textContent = "2부터 9까지의 숫자를 입력해 주세요.";
        input.setAttribute("aria-invalid", "true");
        input.focus();
        return;
      }

      error.textContent = "";
      input.removeAttribute("aria-invalid");
      resultTitle.textContent = `${dan}단`;
      resultCaption.textContent = ` ${dan}에 1부터 9까지 곱한 결과예요.`;
      resultCount.textContent = "9";
      quickPicks.forEach((button) => {
        button.setAttribute("aria-pressed", String(Number(button.dataset.dan) === dan));
      });

      const rows = document.createDocumentFragment();
      for (let multiplier = 1; multiplier <= 9; multiplier += 1) {
        const row = document.createElement("div");
        row.className = "equation";
        row.style.animationDelay = `${(multiplier - 1) * 24}ms`;

        const step = document.createElement("span");
        step.className = "step";
        step.textContent = String(multiplier).padStart(2, "0");

        const math = document.createElement("span");
        math.className = "math";
        math.textContent = `${dan} × ${multiplier}`;

        const answer = document.createElement("span");
        answer.className = "answer";
        answer.textContent = `= ${dan * multiplier}`;

        row.append(step, math, answer);
        rows.append(row);
      }

      const table = document.createDocumentFragment();
      const headings = document.createElement("div");
      headings.className = "table-head";
      headings.setAttribute("aria-hidden", "true");
      headings.innerHTML = "<span>순서</span><span>곱셈식</span><span>결과</span>";
      table.append(headings, rows);
      resultList.replaceChildren(table);
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      makeTable(input.value);
    });

    input.addEventListener("input", () => {
      error.textContent = "";
      input.removeAttribute("aria-invalid");
    });

    quickPicks.forEach((button) => {
      button.addEventListener("click", () => {
        input.value = button.dataset.dan;
        makeTable(input.value);
      });
    });
  </script>
</body>
</html>
