<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>JANGAN BOWLING - 회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f6f7; padding: 50px 0; }
        .signup-container { max-width: 460px; margin: 0 auto; }
        .form-label { font-weight: bold; margin-top: 20px; font-size: 14px; }
        .btn-group-custom { display: flex; gap: 5px; }
        .btn-group-custom .btn { flex: 1; border: 1px solid #ccc; background: white; color: #999; }
        .btn-group-custom .btn.active { border-color: #2ecc71; color: #2ecc71; font-weight: bold; background: #f9fffb; }
        .terms-area { background: white; border: 1px solid #ddd; padding: 20px; margin-top: 30px; border-radius: 5px; }
        .btn-submit { background-color: #2ecc71; color: white; width: 100%; padding: 15px; font-weight: bold; border: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="signup-container">
        <h2 class="text-center mb-4">회원가입</h2>
        <form id="signupForm">
            <label class="form-label">아이디</label>
            <input type="text" class="form-control" placeholder="이메일 주소">

            <label class="form-label">비밀번호</label>
            <input type="password" class="form-control" placeholder="비밀번호 입력">

            <label class="form-label">이름</label>
            <input type="text" class="form-control" placeholder="이름 입력">

            <label class="form-label">성별</label>
            <div class="btn-group-custom">
                <button type="button" class="btn active" onclick="toggleBtn(this, 'gender')">남자</button>
                <button type="button" class="btn" onclick="toggleBtn(this, 'gender')">여자</button>
            </div>

            <label class="form-label">국적</label>
            <div class="btn-group-custom">
                <button type="button" class="btn active" onclick="toggleBtn(this, 'nat')">내국인</button>
                <button type="button" class="btn" onclick="toggleBtn(this, 'nat')">외국인</button>
            </div>

            <div class="terms-area">
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="allAgree">
                    <label class="form-check-label fw-bold" for="allAgree">약관 전체 동의</label>
                </div>
                <hr>
                <div class="form-check mb-2">
                    <input class="form-check-input single-check" type="checkbox" id="term1">
                    <label class="form-check-label small" for="term1">이용약관 동의 (필수)</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input single-check" type="checkbox" id="term2">
                    <label class="form-check-label small" for="term2">개인정보 수집 및 이용 동의 (필수)</label>
                </div>
            </div>

            <button type="submit" class="btn btn-submit">가입하기</button>
        </form>
    </div>

    <script>
        // 성별, 국적 버튼 선택 기능
        function toggleBtn(element, group) {
            const buttons = element.parentElement.querySelectorAll('.btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        // 전체 동의 체크박스 로직
        const allAgree = document.getElementById('allAgree');
        const singleChecks = document.querySelectorAll('.single-check');

        allAgree.addEventListener('change', function() {
            singleChecks.forEach(check => {
                check.checked = allAgree.checked;
            });
        });

        singleChecks.forEach(check => {
            check.addEventListener('change', function() {
                const allChecked = Array.from(singleChecks).every(c => c.checked);
                allAgree.checked = allChecked;
            });
        });
    </script>
</body>
</html>
