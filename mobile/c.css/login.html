<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>JANGAN BOWLING - 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f6f7; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { width: 100%; max-width: 400px; padding: 40px; background: white; border: 1px solid #ddd; border-radius: 8px; }
        .logo { text-align: center; font-size: 28px; font-weight: bold; color: #333; margin-bottom: 30px; text-decoration: none; display: block; }
        .btn-login { background-color: #2ecc71; color: white; font-weight: bold; padding: 12px; width: 100%; border: none; }
        .btn-login:hover { background-color: #27ae60; color: white; }
        .find-links { text-align: center; margin-top: 20px; font-size: 13px; color: #666; }
        .find-links a { color: #666; text-decoration: none; margin: 0 5px; }
    </style>
</head>
<body>
    <div class="login-box shadow-sm">
        <a href="index.html" class="logo">JANGAN <span style="color:#2ecc71;">BOWLING</span></a>
        <form>
            <div class="mb-3">
                <input type="text" class="form-control" placeholder="아이디" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" placeholder="비밀번호" required>
            </div>
            <button type="submit" class="btn btn-login mb-3">로그인</button>
        </form>
        <div class="find-links">
            <a href="#">아이디 찾기</a> | <a href="#">비밀번호 찾기</a> | <a href="signup.html">회원가입</a>
        </div>
    </div>
</body>
</html>
